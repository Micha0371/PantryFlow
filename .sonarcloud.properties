# SonarCloud automatic analysis settings.
# The commit-bound release-assurance kit contains frozen third-party probe drivers,
# deliberately weakened policy examples and duplicate replay implementations. It is
# documentation evidence, not shipped code or maintained tooling; preserve its hashes.
# Exclude only this snapshot from source analysis. App code, runtime tests and maintained
# scripts remain in scope, as do other documentation directories.
sonar.exclusions=docs/release-readiness/review-evidence-25499a6/**

# docs/testing/evidence/ holds frozen prototypes from the feasibility rounds (not migrations, never shipped).
# Each round's prototype is intentionally a near-copy of the previous one, kept unchanged as evidence that
# reviews link to, so duplication detection is excluded there. All other analysis still applies.
# pantry-flow/lib/i18n/*.ts are the translation catalogues (en.ts, de.ts): every language repeats the same
# keys by design, which duplication detection reports as copies. Only the catalogues are excluded
# (index.tsx, the i18n logic, is not matched); all other analysis still applies to them.
sonar.cpd.exclusions=docs/testing/evidence/**,pantry-flow/lib/i18n/*.ts
