# Dedicated disposable local stack. Never link this test project to a remote ref.
project_id = "pantryflow-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

# Mailpit, which catches confirmation emails locally. CLI 3 reads only [local_smtp]; it was [inbucket].
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["pantryflow://auth/callback", "pantryflowtest://auth/callback"]
enable_signup = true
minimum_password_length = 6

[auth.email]
# The provider toggle (CLI 3 deprecates enable_signup here); [auth] enable_signup allows new sign-ups.
enabled = true
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 60

[analytics]
enabled = false
