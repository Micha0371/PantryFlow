appId: com.pantryflow.test
name: Confirmation-required native registration
---
# Part of the single test `confirmation` (Seed: seed:confirmation): the PKCE link only
# opens in the app that registered, so register, complete, reset, resend and complete
# run as one scenario. verify:confirmation reads the outcome back afterwards.
- runScript: helpers/restore.js
- launchApp:
    clearState: true
- tapOn:
    id: go-register
- tapOn:
    id: register-name
- inputText: Confirmation Test
- tapOn:
    id: register-email
- inputText: pf.test.confirm@example.com
- tapOn:
    id: register-password
- inputText: PF-local-test-only-9281!
- hideKeyboard
- tapOn:
    id: register-submit
- assertVisible: Check your email
- assertNotVisible: Your pantry is empty
