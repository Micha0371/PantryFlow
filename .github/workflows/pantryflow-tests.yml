name: PantryFlow behavioral regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: pantryflow-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: pantry-flow
    shell: bash
jobs:
  windows-tooling:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      # keeps install scripts: the root postinstall patches Expo on Windows
      - run: npm ci
      - run: node --test tests/native-tooling.test.cjs
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:fast 2>&1 | tee fast-tests.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: fast-test-diagnostics
          path: pantry-flow/fast-tests.log
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:isolated
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI-PORT-01: Linux gives outgoing connections ports 32768-60999, which include the fixed
      # local Supabase ports (supabase/config.toml, 54320-54329). Reserve them before anything
      # (checkout, npm, image pulls) opens a connection, so Docker can always bind them. Writing
      # the setting replaces the whole list, so the runner's own reservations are kept: the step
      # writes "<existing>,54320-54329" and fails unless every port reserved before, plus ours,
      # is reserved after. Both lists and the ephemeral range are logged for the diagnosis.
      - name: Reserve the local Supabase ports
        working-directory: .
        run: |
          ports() { tr ',' '\n' <<<"$1" | awk -F- 'NF { last = ($2 == "" ? $1 : $2); for (p = $1; p <= last; p++) print p }' | sort -u; }
          before="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ephemeral port range: $(sysctl -n net.ipv4.ip_local_port_range)"
          echo "reserved before: '${before}'"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+${before},}54320-54329"
          after="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "reserved after: '${after}'"
          missing="$(comm -23 <({ ports "$before"; seq 54320 54329; } | sort -u) <(ports "$after"))"
          if [ -n "$missing" ]; then echo "::error::not reserved after the change: $(echo $missing)"; exit 1; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: |
          set -o pipefail
          npm run db:start 2>&1 | tee db-start.log
        id: stack
      - name: Show which process holds a local Supabase port
        if: always() && steps.stack.outcome == 'failure'
        run: sudo ss -tanp | grep -E ':5432[0-9][^0-9]' || echo 'no process holds a local Supabase port now'
      - name: Redact startup diagnostics
        if: always() && steps.stack.outcome == 'failure'
        run: node scripts/redact-startup-log.cjs
      - run: npm run test:local 2>&1 | tee database-tests.log
      - name: Prove bare-write RLS assertions detect permissive policies
        run: npm run test:rls-mutations
      - run: npm run e2e:cleanup
        if: always() && steps.stack.outcome == 'success'
      - run: npx --no-install supabase stop --no-backup
        if: always() && steps.stack.outcome == 'success'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: database-test-diagnostics
          path: |
            pantry-flow/database-tests.log
            pantry-flow/.verification/rls-write-mutations/
          include-hidden-files: true
      - name: Upload failed startup diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && steps.stack.outcome == 'failure'
        with:
          name: database-startup-failure
          path: pantry-flow/db-start.sanitized.log
  # Decides whether the Android job starts on its own: for a pull request, the PR's own changes
  # (three-dot diff against its base); for a push to main, what the push brought in. What counts is
  # defined and tested in pantry-flow/scripts/android-relevance.cjs. Dispatch and the weekly
  # schedule always run Android, whatever this says.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.decide.outputs.android }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: decide
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push)
              # A new branch has no "before"; count everything as relevant then.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "android=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              range="$PUSH_BEFORE..HEAD" ;;
            *) echo "android=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git diff --name-only "$range" | node pantry-flow/scripts/android-relevance.cjs >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  android:
    # Starts on its own for Android-relevant pull requests and pushes to main (see `changes`), and on
    # dispatch, the weekly schedule or a "[full-e2e]" push. It no longer waits for fast and database:
    # it runs beside them, so a run takes the time of the Android job alone.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        needs.changes.outputs.android == 'true' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-e2e]')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes]
    steps:
      # CI-PORT-01: Linux gives outgoing connections ports 32768-60999, which include the fixed
      # local Supabase ports (supabase/config.toml, 54320-54329). Reserve them before anything
      # (checkout, npm, image pulls) opens a connection, so Docker can always bind them. Writing
      # the setting replaces the whole list, so the runner's own reservations are kept: the step
      # writes "<existing>,54320-54329" and fails unless every port reserved before, plus ours,
      # is reserved after. Both lists and the ephemeral range are logged for the diagnosis.
      - name: Reserve the local Supabase ports
        working-directory: .
        run: |
          ports() { tr ',' '\n' <<<"$1" | awk -F- 'NF { last = ($2 == "" ? $1 : $2); for (p = $1; p <= last; p++) print p }' | sort -u; }
          before="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ephemeral port range: $(sysctl -n net.ipv4.ip_local_port_range)"
          echo "reserved before: '${before}'"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+${before},}54320-54329"
          after="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "reserved after: '${after}'"
          missing="$(comm -23 <({ ports "$before"; seq 54320 54329; } | sort -u) <(ports "$after"))"
          if [ -n "$missing" ]; then echo "::error::not reserved after the change: $(echo $missing)"; exit 1; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Gradle's dependencies are cached (saved when the lockfile changes), restored from this branch
      # or from main. A native compile cache (ccache) was tried in #90 and #92 and removed: three runs,
      # 0 hits, and the build stayed at 9-10 minutes.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('pantry-flow/package-lock.json') }}
          restore-keys: android-gradle-
      - run: npm ci --ignore-scripts
      - run: |
          set -o pipefail
          npm run db:start 2>&1 | tee db-start.log
        id: stack
      - name: Show which process holds a local Supabase port
        if: always() && steps.stack.outcome == 'failure'
        run: sudo ss -tanp | grep -E ':5432[0-9][^0-9]' || echo 'no process holds a local Supabase port now'
      - name: Redact startup diagnostics
        if: always() && steps.stack.outcome == 'failure'
        run: node scripts/redact-startup-log.cjs
      - run: npm run db:reset
      - run: npm run e2e:prepare
      - run: npm run e2e:build
      - name: Save the Gradle cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('pantry-flow/package-lock.json') }}
      - name: Install pinned Maestro CLI
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/pantryflow-maestro
          echo /tmp/pantryflow-maestro/maestro/bin >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: pantry-flow
          script: npm run test:e2e
      - run: npm run e2e:cleanup
        if: always() && steps.stack.outcome == 'success'
      - run: npx --no-install supabase stop --no-backup
        if: always() && steps.stack.outcome == 'success'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: android-e2e-diagnostics
          path: |
            pantry-flow/.verification/maestro
          include-hidden-files: true
          retention-days: 7
      - name: Upload failed startup diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && steps.stack.outcome == 'failure'
        with:
          name: android-startup-failure
          path: pantry-flow/db-start.sanitized.log
          retention-days: 7
