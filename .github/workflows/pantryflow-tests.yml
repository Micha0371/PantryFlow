name: PantryFlow behavioral regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: pantryflow-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: pantry-flow
    shell: bash
jobs:
  windows-tooling:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      # keeps install scripts: the root postinstall patches Expo on Windows
      - run: npm ci
      - run: node --test tests/native-tooling.test.cjs
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:fast 2>&1 | tee fast-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fast-test-diagnostics
          path: pantry-flow/fast-tests.log
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:isolated
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI-PORT-01: Linux gives outgoing connections ports 32768-60999, which include the fixed
      # local Supabase ports (supabase/config.toml, 54320-54329). Reserve them before anything
      # (checkout, npm, image pulls) opens a connection, so Docker can always bind them. Writing
      # the setting replaces the whole list, so the runner's own reservations are kept: the step
      # writes "<existing>,54320-54329" and fails unless every port reserved before, plus ours,
      # is reserved after. Both lists and the ephemeral range are logged for the diagnosis.
      - name: Reserve the local Supabase ports
        working-directory: .
        run: |
          ports() { tr ',' '\n' <<<"$1" | awk -F- 'NF { last = ($2 == "" ? $1 : $2); for (p = $1; p <= last; p++) print p }' | sort -u; }
          before="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ephemeral port range: $(sysctl -n net.ipv4.ip_local_port_range)"
          echo "reserved before: '${before}'"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+${before},}54320-54329"
          after="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "reserved after: '${after}'"
          missing="$(comm -23 <({ ports "$before"; seq 54320 54329; } | sort -u) <(ports "$after"))"
          if [ -n "$missing" ]; then echo "::error::not reserved after the change: $(echo $missing)"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: |
          set -o pipefail
          npm run db:start 2>&1 | tee db-start.log
        id: stack
      - name: Show which process holds a local Supabase port
        if: always() && steps.stack.outcome == 'failure'
        run: sudo ss -tanp | grep -E ':5432[0-9][^0-9]' || echo 'no process holds a local Supabase port now'
      - name: Redact startup diagnostics
        if: always() && steps.stack.outcome == 'failure'
        run: node scripts/redact-startup-log.cjs
      - run: npm run test:local 2>&1 | tee database-tests.log
      - name: Prove bare-write RLS assertions detect permissive policies
        run: npm run test:rls-mutations
      - run: npm run e2e:cleanup
        if: always() && steps.stack.outcome == 'success'
      - run: npx --no-install supabase stop --no-backup
        if: always() && steps.stack.outcome == 'success'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: database-test-diagnostics
          path: |
            pantry-flow/database-tests.log
            pantry-flow/.verification/rls-write-mutations/
          include-hidden-files: true
      - name: Upload failed startup diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.stack.outcome == 'failure'
        with:
          name: database-startup-failure
          path: pantry-flow/db-start.sanitized.log
  android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [fast, database]
    steps:
      # CI-PORT-01: Linux gives outgoing connections ports 32768-60999, which include the fixed
      # local Supabase ports (supabase/config.toml, 54320-54329). Reserve them before anything
      # (checkout, npm, image pulls) opens a connection, so Docker can always bind them. Writing
      # the setting replaces the whole list, so the runner's own reservations are kept: the step
      # writes "<existing>,54320-54329" and fails unless every port reserved before, plus ours,
      # is reserved after. Both lists and the ephemeral range are logged for the diagnosis.
      - name: Reserve the local Supabase ports
        working-directory: .
        run: |
          ports() { tr ',' '\n' <<<"$1" | awk -F- 'NF { last = ($2 == "" ? $1 : $2); for (p = $1; p <= last; p++) print p }' | sort -u; }
          before="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "ephemeral port range: $(sysctl -n net.ipv4.ip_local_port_range)"
          echo "reserved before: '${before}'"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+${before},}54320-54329"
          after="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          echo "reserved after: '${after}'"
          missing="$(comm -23 <({ ports "$before"; seq 54320 54329; } | sort -u) <(ports "$after"))"
          if [ -n "$missing" ]; then echo "::error::not reserved after the change: $(echo $missing)"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pantry-flow/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - run: |
          set -o pipefail
          npm run db:start 2>&1 | tee db-start.log
        id: stack
      - name: Show which process holds a local Supabase port
        if: always() && steps.stack.outcome == 'failure'
        run: sudo ss -tanp | grep -E ':5432[0-9][^0-9]' || echo 'no process holds a local Supabase port now'
      - name: Redact startup diagnostics
        if: always() && steps.stack.outcome == 'failure'
        run: node scripts/redact-startup-log.cjs
      - run: npm run db:reset
      - run: npm run e2e:prepare
      - run: npm run e2e:build
      - name: Install pinned Maestro CLI
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/pantryflow-maestro
          echo /tmp/pantryflow-maestro/maestro/bin >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: pantry-flow
          script: npm run test:e2e
      - run: npm run e2e:cleanup
        if: always() && steps.stack.outcome == 'success'
      - run: npx --no-install supabase stop --no-backup
        if: always() && steps.stack.outcome == 'success'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-e2e-diagnostics
          path: |
            pantry-flow/.verification/maestro
          include-hidden-files: true
          retention-days: 7
      - name: Upload failed startup diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.stack.outcome == 'failure'
        with:
          name: android-startup-failure
          path: pantry-flow/db-start.sanitized.log
          retention-days: 7
