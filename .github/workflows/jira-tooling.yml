name: Jira local tooling
on:
  pull_request:
    paths: ['tools/jira/**', '.github/workflows/jira-tooling.yml']
  push:
    branches: [main]
    paths: ['tools/jira/**', '.github/workflows/jira-tooling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jira-fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python tools/jira/run_tests.py
